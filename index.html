<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/ericocosta.css">
    <link rel="icon" href="https://avatars.githubusercontent.com/u/159331833?v=4" type="image/x-icon">
    <title>Perfis enviados pela turma</title>
</head>
<body>
    <header>
        <h1>Lista de Perfis</h1>
    </header>
    <main>
        <section id="informacoes">
            <div id="preferencias">
                <div id="gosto">
                    <p>Enviados:</p>
                    <ul>
                        <li>
                            <span>
                                <img class="foto-perfil" src="./assets/img/tha-lin1.png" alt="Foto de Thaline Chaves">
                            </span>
                            Thaline Chaves 
                        </li>
                        <li>
                            <span>
                                <img class="foto-perfil" src="./assets/img/taymaralima04.png" alt="Foto de Taymara Lima">

                        <li>
                            <span>
                                <img class="foto-perfil" src="./assets/img/fernadoportela.png" alt="Foto de Fernado Portela">

                            Fernado Portela</li>
                        <li>
                            <span>
                                <img class="foto-perfil" src="./assets/img/francihellen.png" alt="Foto de Franciellen">
                            </span>
                            Francihellen</li>
                        
                </div>
                <div id="naogosto">
                    <p>Não Enviados:</p>
                    <ul>
                        <li>Fakes</li>
                        <li>Falsidade</li>
                        <li>Injustiça</li>
                        <li>Deslealdade</li>
                        <li>Intolerância</li>

            </div>

    <footer>
        <p>@Desenvolvido pela turma do 2º Ano - Desenvolvimento de Sistemas</p>
